version: '2.0'
services:
    # PostgreSQL database
    db:
        container_name: PostgreSQL
        image: postgres:11-alpine
        security_opt:
          # See: https://wiki.alpinelinux.org/wiki/Release_Notes_for_Alpine_3.13.0#time64_requirements
          - seccomp:unconfined
        volumes:
          - var-lib-postgresql-data:/var/lib/postgresql/data
          - var-run-postgresql:/var/run/postgresql
        environment:
          - POSTGRES_USER=${POSTGRES_USER:-pynab}
          - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pynab}
          - TZ=${TZ:-Europe/Paris}
    # Pynab services
    pynab:
        container_name: Pynab
        build:
            context: ..
            dockerfile: Docker/nab/Dockerfile
            args:
              PYTHON_VERSION: ${PYTHON_VERSION:-3.9}
              INSTALL_EXTRAS: ${INSTALL_EXTRAS:-all}
        volumes:
          - ../:/opt/pynab
          - var-run-postgresql:/var/run/postgresql
        depends_on:
          - db
        environment:
          # Services to run (space-separated list)
          - DAEMONS=${DAEMONS:-nab8balld nabairqualityd nabbookd nabclockd nabmastodond nabsurprised nabtaichid nabweatherd}
          - TZ=${TZ:-Europe/Paris}
          # Virtual hardware mode (true for development)
          - PYNAB_VIRTUAL_HARDWARE=${PYNAB_VIRTUAL_HARDWARE:-true}
          # Debug mode
          - DJANGO_DEBUG=${DJANGO_DEBUG:-false}
        command: ["/bin/bash", "/usr/local/bin/run-pynab.sh"]
        ports:
          - "${NABD_PORT:-10543}:10543"
          - "${NABIO_PORT:-10544}:10544"
          - "${WEB_PORT:-8000}:8000"
volumes:
    # Share the PostgreSQL socket between containers
    var-run-postgresql:
    # Persist the PostgreSQL data across restarts
    var-lib-postgresql-data:
