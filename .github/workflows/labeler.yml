name: 🏷️ Pull Request Labeler
on:
  - pull_request_target

permissions:
  contents: read
  pull-requests: write

jobs:
  pr_triage:
    runs-on: ubuntu-24.04

    steps:
      - name: Apply labels
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labels.yml
          sync-labels: true
